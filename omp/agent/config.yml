modelRoles:
  default: anthropic/claude-fable-5-2:high
  plan: anthropic/claude-fable-5-2:high
  task: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  advisor: openai-codex/gpt-6-astra:medium
  vision: openai-codex/gpt-6.1-terra:auto
  smol: anthropic/claude-haiku-5-5
  commit: anthropic/claude-haiku-5-5
  tiny: anthropic/claude-haiku-5-5
  memory: anthropic/claude-haiku-5-5
defaultThinkingLevel: high
disabledProviders:
  - openrouter
  - amazon-bedrock
  - bedrock-mantle
  - agent-plugins
advisor:
  enabled: true
task:
  isolation:
    enabled: true
  agentModelOverrides:
    task: "@task"
    poteto-agent: "@task"
    reviewer: "@slow"
    security-reviewer: "@slow"
    thermo-nuclear-review-subagent: "@slow"
    thermo-nuclear-code-quality-review-subagent: "@slow"
    comment-sicko: "@slow"
    scout: "@smol"
    sonic: "@smol"
  showResolvedModelBadge: true
  agentAdvisor:
    task: openai-codex/gpt-6.1-sol:medium
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol
    task:
      - openai-codex/gpt-6.1-sol
    slow:
      - openai-codex/gpt-6-astra:medium
    vision:
      - anthropic/claude-opus-5-5:high
    smol:
      - openai-codex/gpt-6-luna:medium
symbolPreset: nerd
composer:
  shape: claude
  tokenRate: true
theme:
  dark: titanium
  light: light-zenith
setupVersion: 3
colorBlindMode: true
images:
  blockImages: true
tui:
  imeSafeCursor: true
dev:
  autoqaConsent: granted
browser:
  headless: true
codexResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
update:
  auto: true